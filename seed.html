const EXPECTED_EMAIL='mark.fiorente@gmail.com';
const log=(msg,cls='')=>{const el=document.getElementById('status');el.innerHTML+=`<span class="${cls}">${msg}</span>\n`;el.scrollTop=el.scrollHeight;};
const clear=()=>{document.getElementById('status').innerHTML='';};
onAuthStateChanged(auth,u=>{if(u)log(`Logueado: ${u.email} (${u.uid})`,'ok');else log('Sin sesión activa.','warn');});
window.runSeed=async()=>{
  clear();const u=auth.currentUser;if(!u){log('Inicia sesión primero.','err');return;}
  if(u.email!==EXPECTED_EMAIL){log(`Logueado como ${u.email}, seed es para ${EXPECTED_EMAIL}`,'warn');if(!confirm('Continuar?'))return;}
  const owned=Object.values(STICKER_DATA).filter(v=>v>0).length;
  log(`Escribiendo ${Object.keys(STICKER_DATA).length} laminitas (UID: ${u.uid})`,'warn');
  log(`Tengo: ${owned}  |  Faltan: ${Object.keys(STICKER_DATA).length-owned}`);
  try{
    await setDoc(doc(db,'users',u.uid,'stickers','album'),{...STICKER_DATA,lastUpdated:serverTimestamp()});
    log('¡Listo! Album actualizado en Firestore.','ok');
    log(`Recarga la app para ver tus ${owned} laminitas.`,'ok');
  }catch(e){log(`Error: ${e.message}`,'err');console.error(e);}
};
window.checkStatus=async()=>{
  clear();const u=auth.currentUser;if(!u){log('Inicia sesión primero.','err');return;}
  log(`Leyendo ${u.email}...`,'warn');
  try{
    const snap=await getDoc(doc(db,'users',u.uid,'stickers','album'));
    if(!snap.exists()){log('Sin documento aún.','warn');return;}
    const d=snap.data(),keys=Object.keys(d).filter(k=>k!=='lastUpdated');
    const owned=keys.filter(k=>d[k]>0).length;
    log(`Claves: ${keys.length} | Tengo: ${owned} | Faltan: ${keys.length-owned}`);
    const ts=d.lastUpdated?.toDate?.()?.toLocaleString?.();if(ts)log(`Última actualización: ${ts}`);
  }catch(e){log(`Error: ${e.message}`,'err');}
};
