const log = (msg, cls='') => {
  const el = document.getElementById('status');
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
};
const clear = () => { document.getElementById('status').innerHTML = ''; };

onAuthStateChanged(auth, user => {
  if (user) {
    log(`Logueado como: ${user.email} (UID: ${user.uid})`, 'ok');
  } else {
    log('No hay sesion activa. Abre la app principal e inicia sesion primero.', 'warn');
  }
});

window.runSeed = async () => {
  clear();
  const user = auth.currentUser;
  if (!user) { log('Debes iniciar sesion primero.', 'err'); return; }
  if (user.email !== 'ruslank2010@gmail.com') {
    log(`Estas logueado como ${user.email}. Este seed es para ruslank2010@gmail.com.`, 'warn');
    if (!confirm('Continuar de todas formas?')) return;
  }
  const owned = Object.values(STICKER_DATA).filter(v => v > 0).length;
  log(`Escribiendo 980 laminitas para UID: ${user.uid}`, 'warn');
  log(`Tengo: ${owned}  |  Faltan: ${980 - owned}`);
  try {
    const ref = doc(db, 'users', user.uid, 'stickers', 'album');
    await setDoc(ref, { ...STICKER_DATA, lastUpdated: serverTimestamp() });
    log('Listo! El album ha sido actualizado en Firestore.', 'ok');
    log(`Recarga la app principal para ver las ${owned} laminitas.`, 'ok');
  } catch (err) {
    log(`Error: ${err.message}`, 'err');
    console.error(err);
  }
};

window.checkStatus = async () => {
  clear();
  const user = auth.currentUser;
  if (!user) { log('Debes iniciar sesion primero.', 'err'); return; }
  log(`Leyendo album de ${user.email}...`, 'warn');
  try {
    const ref = doc(db, 'users', user.uid, 'stickers', 'album');
    const snap = await getDoc(ref);
    if (!snap.exists()) { log('El documento no existe aun.', 'warn'); return; }
    const d = snap.data();
    const keys = Object.keys(d).filter(k => k !== 'lastUpdated');
    const owned = keys.filter(k => d[k] > 0).length;
    log(`Total claves: ${keys.length}`);
    log(`Tengo: ${owned}`, 'ok');
    log(`Faltan: ${keys.length - owned}`, 'warn');
    const ts = d.lastUpdated?.toDate?.()?.toLocaleString?.();
    if (ts) log(`Ultima actualizacion: ${ts}`);
  } catch (err) {
    log(`Error: ${err.message}`, 'err');
  }
};
